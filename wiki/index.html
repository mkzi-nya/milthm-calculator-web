<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>Milthm Wiki</title>
<style>:root{
  --bg:#1a1a1a; --fg:#e5e5e5; --muted:#aaa; --accent:#42b883;
  --panel:#232323; --panel2:#2b2b2b; --line:#333; --bar:#252525;
}
*{box-sizing:border-box;}
html{font-size:clamp(14px,1.05vw + 0.55rem,19px);}
body{
  margin:0;background:var(--bg);color:var(--fg);line-height:1.75;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  -webkit-text-size-adjust:100%;
}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}

/* ===== 菜单按钮 ===== */
#menuBtn{
  position:fixed;left:.7rem;bottom:.9rem;z-index:60;
  width:2.7rem;height:2.7rem;border-radius:12px;border:1px solid var(--line);
  background:rgba(40,40,40,.92);color:#fff;font-size:1.25rem;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.5);backdrop-filter:blur(4px);
}
#menuBtn:active{transform:scale(.95);}

/* ===== 左侧栏（页面导航） ===== */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .22s;}
#scrim.on{opacity:1;pointer-events:auto;}
#sidebar{
  position:fixed;left:0;top:0;bottom:0;width:min(86vw,300px);z-index:80;
  background:var(--panel);border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .24s ease;
  display:flex;flex-direction:column;overflow:hidden;
}
#sidebar.on{transform:none;}
.sb-head{
  padding:.85rem .9rem;font-weight:700;color:#fff;font-size:1.02rem;
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  flex:0 0 auto;
}
.sb-close{
  border:1px solid var(--line);background:var(--panel2);color:#ddd;
  width:1.9rem;height:1.9rem;border-radius:8px;font-size:1.1rem;line-height:1;cursor:pointer;flex:0 0 auto;
}
.sb-close:hover{color:#fff;border-color:var(--accent);}

.sb-toplinks{flex:0 0 auto;padding:.6rem .7rem;display:flex;flex-direction:column;gap:.45rem;border-bottom:1px solid var(--line);}
.sb-home{
  width:100%;padding:.55rem .8rem;border-radius:10px;
  background:linear-gradient(90deg,#2e7d5b,#2b6e54);color:#fff;font-weight:600;font-size:.9rem;
  cursor:pointer;border:1px solid #3a8c66;text-align:center;
}
.sb-home:hover{filter:brightness(1.08);}
.sb-home-sub{background:var(--panel2);border-color:var(--line);color:#d7d7d7;font-weight:500;}
.sb-home-sub:hover{color:#fff;border-color:var(--accent);filter:none;}

.sb-group{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;}
.sb-ghead{
  display:flex;align-items:center;justify-content:space-between;
  padding:.68rem 1rem;cursor:pointer;color:#fff;font-weight:600;font-size:.93rem;
  user-select:none;-webkit-user-select:none;flex:0 0 auto;
}
.sb-ghead:hover{background:var(--panel2);}
.sb-ghead-static{cursor:default;color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:.75rem 1rem .35rem;}
.sb-ghead-static:hover{background:transparent;}
.sb-gbody{overflow-y:auto;overscroll-behavior:contain;padding:.1rem 0 .6rem;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;}
.sb-item{
  display:block;padding:.5rem 1rem;color:#cfcfcf;font-size:.88rem;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;
}
.sb-item:hover{background:var(--panel2);color:#fff;text-decoration:none;}
.sb-item.cur{background:#42b88326;color:#fff;border-left:3px solid var(--accent);padding-left:.72rem;}
.sb-item.lv3{padding-left:1.9rem;font-size:.84rem;color:#b3b3b3;}
.sb-chapter{
  display:block;padding:.7rem .9rem .25rem;color:var(--muted);
  font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
  position:sticky;top:0;background:var(--panel);z-index:1;
}
.sb-ext{color:#cfcfcf;}
.sb-ext:hover{color:#fff;}
.sb-foot{padding:.6rem 1rem .75rem;color:var(--muted);font-size:.75rem;border-top:1px solid var(--line);text-align:center;flex:0 0 auto;}

/* ===== 右侧栏（总览） ===== */
#tocPanel{
  position:fixed;right:0;top:0;bottom:0;width:min(86vw,300px);z-index:85;
  background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .24s ease;
  display:flex;flex-direction:column;overflow:hidden;
}
#tocPanel.on{transform:none;}
.toc-head{
  padding:.85rem .9rem;font-weight:700;color:#fff;font-size:1.02rem;
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex:0 0 auto;
}
.toc-search{
  margin:.6rem .7rem;padding:.5rem .7rem;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-size:.86rem;outline:none;flex:0 0 auto;
}
.toc-search:focus{border-color:var(--accent);}
.toc-list{overflow-y:auto;overscroll-behavior:contain;padding:.1rem 0 .8rem;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch;}
.toc-empty{padding:1rem;color:var(--muted);font-size:.85rem;text-align:center;}

/* ===== 内容 ===== */
#content{max-width:920px;margin:0 auto;padding:3.2rem 1rem 4rem;}
#content h2,#content h3{scroll-margin-top:.8rem;}
@media(min-width:1200px){#content{padding-left:3rem;padding-right:3rem;}}
h1,h2,h3,h4{font-weight:650;color:#fff;margin-top:1.5em;margin-bottom:.55em;line-height:1.35;}
h1{font-size:1.55rem;margin-top:0;}
h2{font-size:1.28rem;border-bottom:1px solid var(--line);padding-bottom:.25em;}
h3{font-size:1.1rem;} h4{font-size:1rem;}
p,li{color:#dcdcdc;}
ul,ol{padding-left:1.4em;}
table{width:100%;border-collapse:collapse;margin:1.1em 0;font-size:.92rem;}
table th,table td{border:1px solid var(--line);padding:.5em .6em;white-space:normal;text-align:left;}
table th{background:var(--panel2);}
table tr:nth-child(2n){background:#202020;}
blockquote{border-left:4px solid #6b6b6b;padding:.1em 1em;margin-left:0;color:#9a9a9a;background:#222;border-radius:0 8px 8px 0;}
blockquote p,blockquote li,blockquote code{color:#9a9a9a;}
code{background:var(--panel2);padding:.1em .35em;border-radius:4px;font-size:.9em;font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
.code-wrap{position:relative;margin:1.1em 0;}
.code-wrap pre{margin:0;padding-top:1.9em;background:var(--panel2);padding:1.9em .9em .9em;border-radius:8px;overflow-x:auto;border:1px solid var(--line);}
pre{background:var(--panel2);padding:.9em;border-radius:8px;overflow-x:auto;border:1px solid var(--line);}
pre code{background:transparent;padding:0;}
.code-copy{
  position:absolute;top:.4rem;right:.4rem;z-index:2;
  padding:.28em .7em;border-radius:7px;border:1px solid var(--line);
  background:rgba(45,45,45,.95);color:#d0d0d0;font-size:.72rem;line-height:1.4;cursor:pointer;
  opacity:.9;transition:color .15s,border-color .15s,opacity .15s;
}
.code-copy:hover{color:#fff;border-color:var(--accent);opacity:1;}
.code-copy.copied{color:var(--accent);border-color:var(--accent);}
hr{border:0;border-top:1px solid var(--line);margin:1.6em 0;}
img{max-width:100%;border-radius:8px;}

.page-head{
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  margin-bottom:1.2rem;padding:.55rem .85rem;border:1px solid var(--line);border-radius:10px;
  background:var(--bar);font-weight:700;color:#fff;font-size:1.02rem;
  position:sticky;top:.5rem;z-index:30;
}
.top-btn{
  flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);color:#fff;
  border-radius:8px;padding:.3em .7em;cursor:pointer;font-size:.82rem;
}
.top-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ===== 章节块（错误等） ===== */
.chap{margin:0 0 1.6rem;}
.chap-bar{
  display:flex;align-items:center;gap:.6rem;justify-content:space-between;
  background:var(--bar);border:1px solid var(--line);border-radius:10px;
  padding:.55rem .8rem;margin-bottom:.9rem;
}
.chap-title{font-weight:700;color:#fff;font-size:1rem;}
.chap-body>*:first-child{margin-top:.2em;}

/* ===== 图片占位 ===== */
.wiki-img{margin:14px auto;text-align:center;width:100%;}
.wiki-img img{display:block;max-width:100%;height:auto;margin:0 auto;}
.wiki-img .loading-container{padding:16px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:8px;}
.wiki-img .error-container{padding:14px;color:#ff9d9d;background:#311;border:1px solid #a33;border-radius:8px;font-size:.88rem;}
.wiki-img .retry-button{margin-top:8px;padding:.35em .8em;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:#fff;cursor:pointer;}

/* ===== 工具提示（chartdev info 卡片） ===== */
div[aaa]{
  visibility:hidden;opacity:0;
  transition:opacity .12s ease-in-out,visibility .12s ease-in-out,top .12s ease,left .12s ease;
}
div[aaa].visible{visibility:visible;opacity:1;}
.info-card{
  position:absolute;z-index:1000;
  width:min(78vw,270px);max-height:70vh;overflow:auto;
  padding:.7rem .8rem;border-radius:12px;
  background:rgba(30,30,30,.98);border:1px solid #3a3a3a;color:#e8e8e8;
  font:400 .78rem/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  box-shadow:0 10px 28px rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-overflow-scrolling:touch;
}
.info-card p{margin:0 0 .35em;color:#d8d8d8;}
.info-card p:last-child{margin-bottom:0;}
.info-card a{color:#5db2ff;text-decoration:none;}
.info-card a:hover{text-decoration:underline;}
.info-card b,.info-card strong{color:#fff;font-weight:600;}

/* ===== 加载 ===== */
#loading{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;color:#fff;
}
#loading .sub{color:var(--muted);font-size:.85rem;}
.spinner{width:42px;height:42px;border-radius:50%;border:3px solid #444;border-top-color:var(--accent);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* katex 显示居中 */
.katex-display{display:block !important;text-align:center;margin:10px 0;}
pre,code,kbd{user-select:text;}

/* ===== 曲目列表页 ===== */
.song-index{padding-bottom:1rem;}
.song-search-input{
  width:100%;padding:.7rem .9rem;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-size:.95rem;outline:none;
}
.song-search-input:focus{border-color:var(--accent);}
.song-index-count{margin:.7rem .2rem 1rem;color:var(--muted);font-size:.82rem;}
.song-chapter{margin:0 0 1.5rem;}
.song-chapter h2{
  font-size:1.05rem;margin:0 0 .7rem;padding-bottom:.3rem;
  border-bottom:1px solid var(--line);color:#fff;
}
.song-chapter-link{color:#fff;text-decoration:none;cursor:pointer;}
.song-chapter-link:hover{color:var(--accent);text-decoration:none;}
.song-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.5rem;}
.song-card{
  display:block;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:#dcdcdc;font-size:.87rem;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.song-card:hover{background:var(--panel2);border-color:var(--accent);color:#fff;text-decoration:none;}

/* ===== 响应式 ===== */
@media(min-width:1100px){
  #menuBtn{display:none !important;}
  #scrim{display:none !important;}
  #sidebar{transform:none;width:272px;box-shadow:none;}
  #sidebar .sb-close{display:none !important;}
  body.sb-fixed{padding-left:272px;}
  #tocPanel{width:280px;transform:none;border-left:1px solid var(--line);}
  #tocPanel .toc-close{display:none !important;}
  body.toc-fixed{padding-right:280px;}
  /* 大屏隐藏顶部横栏 */
  body.toc-fixed .page-head{display:none !important;}
  body.toc-fixed #content{padding-top:2.4rem;padding-left:2.2rem;padding-right:2.2rem;}
}
@media(max-width:1099px){
  #tocPanel{box-shadow:-6px 0 20px rgba(0,0,0,.5);}
  .toc-btn{position:relative;}
}
@media(max-width:600px){
  body{line-height:1.8;}
  #content{padding:2.9rem .85rem 3rem;}
  .sb-item{padding:.6rem 1rem;font-size:.9rem;}
  .sb-head{padding:.8rem .85rem;font-size:1rem;}
  .song-grid{grid-template-columns:1fr 1fr;}
}
